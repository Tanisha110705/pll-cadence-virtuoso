  <text x="175.0" y="356.75" font-size="13" font-weight="bold" fill="#1f2937" text-anchor="middle">NMOS mirror</text>
  <text x="175.0" y="374.25" font-size="11.5" font-weight="normal" fill="#5b6472" text-anchor="middle">reference side</text>
