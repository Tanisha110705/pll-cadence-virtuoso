  <rect x="400" y="296" width="170" height="44" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6"/>
  <text x="485.0" y="322.5" font-size="13" font-weight="bold" fill="#1f2937" text-anchor="middle">DOWN switch</text>
  <rect x="400" y="358" width="170" height="56" rx="8" fill="#f4f7fb" stroke="#334155" stroke-width="1.6"/>
