  <polyline points="175,180 175,218" fill="none" stroke="#334155" stroke-width="1.6" stroke-linejoin="round"/>
  <polyline points="175,280 175,328" fill="none" stroke="#334155" stroke-width="1.6" stroke-linejoin="round"/>
