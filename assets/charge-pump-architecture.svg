  <text x="330" y="142" font-size="10.5" font-weight="normal" fill="#5b6472" text-anchor="middle">mirror</text>
  <text x="330" y="362" font-size="10.5" font-weight="normal" fill="#5b6472" text-anchor="middle">mirror</text>
  <polyline points="620,208 572,208" fill="none" stroke="#7c3aed" stroke-width="2" stroke-linejoin="round" marker-end="url(#a7c3aed)"/>
  <text x="626" y="212" font-size="11.5" font-weight="bold" fill="#7c3aed" text-anchor="start">UP (via inverter M11/M12)</text>
  <polyline points="620,318 572,318" fill="none" stroke="#7c3aed" stroke-width="2" stroke-linejoin="round" marker-end="url(#a7c3aed)"/>
  <text x="626" y="322" font-size="11.5" font-weight="bold" fill="#7c3aed" text-anchor="start">DOWN</text>
  <polyline points="485,267 700,267" fill="none" stroke="#c2410c" stroke-width="2" stroke-linejoin="round" marker-end="url(#ac2410c)"/>
  <text x="706" y="262" font-size="12" font-weight="bold" fill="#c2410c" text-anchor="start">Out → loop filter</text>
  <text x="706" y="280" font-size="11" font-weight="normal" fill="#5b6472" text-anchor="start">(V_CP in the PLL)</text>
  <polyline points="270,250 270,290" fill="none" stroke="#c2410c" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#ac2410c)"/>
  <text x="280" y="275" font-size="10.5" font-weight="normal" fill="#c2410c" text-anchor="start">reference current</text>
  <rect x="40" y="462" width="840" height="44" rx="8" fill="#fff7ed" stroke="#fdba74"/>
  <text x="56" y="481" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">UP: PMOS branch sources I_CP → Out ramps up.  DOWN: NMOS branch sinks I_CP → Out ramps down.  Neither: high-impedance hold.</text>
  <text x="56" y="498" font-size="11" font-weight="normal" fill="#5b6472" text-anchor="start">Exact switch placement inside each stacked branch is not resolvable from the screenshots — see schematics/charge-pump.</text>
</svg>
