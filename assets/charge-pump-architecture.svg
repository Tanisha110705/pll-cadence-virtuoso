  <text x="64" y="458" font-size="11.5" font-weight="bold" fill="#1f2937" text-anchor="start">GND</text>
  <rect x="90" y="120" width="170" height="60" rx="8" fill="#f4f7fb" stroke="#334155" stroke-width="1.6"/>
  <text x="175.0" y="146.75" font-size="13" font-weight="bold" fill="#1f2937" text-anchor="middle">PMOS mirror</text>
  <text x="175.0" y="164.25" font-size="11.5" font-weight="normal" fill="#5b6472" text-anchor="middle">reference side</text>
