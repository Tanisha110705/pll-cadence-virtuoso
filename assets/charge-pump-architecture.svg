  <polyline points="485,168 485,184" fill="none" stroke="#334155" stroke-width="1.6" stroke-linejoin="round"/>
  <polyline points="485,230 485,262" fill="none" stroke="#334155" stroke-width="1.6" stroke-linejoin="round"/>
  <polyline points="485,272 485,294" fill="none" stroke="#334155" stroke-width="1.6" stroke-linejoin="round"/>
