  <text x="845" y="309" font-size="11" font-weight="normal" fill="#5b6472" text-anchor="start">4.2067 GHz @ 1.8 V</text>
  <text x="845" y="326" font-size="11" font-weight="normal" fill="#5b6472" text-anchor="start">Kvco(avg) = 20.03e9</text>
  <text x="845" y="343" font-size="11" font-weight="normal" fill="#5b6472" text-anchor="start">rad/s/V (report)</text>
  <rect x="40" y="446" width="900" height="56" rx="8" fill="#fff7ed" stroke="#fdba74"/>
  <text x="56" y="469" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">Mechanism (general principle): higher Vcontrol → larger starving current → each stage charges its load faster → shorter delay t_d.</text>
  <text x="56" y="489" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">For an N-stage ring, f ≈ 1 / (2·N·t_d), with N = 3 here. Dashed grey = PMOS bias line (mirrored); orange = Vcontrol line.</text>
</svg>
