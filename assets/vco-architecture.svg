  <text x="24" y="58" font-size="12.5" font-weight="normal" fill="#5b6472" text-anchor="start">Topology read from the Virtuoso schematic: 4 PMOS + 4 NMOS bias/starving devices, 3 inverter cells (vco_inverter)</text>
