  <text x="940" y="242" font-size="12" font-weight="bold" fill="#1f2937" text-anchor="end">160 MHz</text>
  <line x1="690" y1="273" x2="940" y2="273" stroke="#e5e7eb"/>
  <text x="690" y="266" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">÷32</text>
  <text x="940" y="266" font-size="12" font-weight="bold" fill="#1f2937" text-anchor="end">80 MHz</text>
  <line x1="690" y1="297" x2="940" y2="297" stroke="#e5e7eb"/>
  <text x="690" y="290" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">÷64</text>
  <text x="940" y="290" font-size="12" font-weight="bold" fill="#1f2937" text-anchor="end">40 MHz</text>
  <line x1="690" y1="321" x2="940" y2="321" stroke="#e5e7eb"/>
  <text x="690" y="314" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">÷128 (FB)</text>
  <text x="940" y="314" font-size="12" font-weight="bold" fill="#15803d" text-anchor="end">20 MHz = Fref</text>
  <text x="690" y="358" font-size="11.5" font-weight="normal" fill="#5b6472" text-anchor="start">Each toggle stage halves the frequency.</text>
  <text x="690" y="376" font-size="11.5" font-weight="normal" fill="#5b6472" text-anchor="start">Seven stages: 2^7 = 128.</text>
