  <line x1="690" y1="225" x2="940" y2="225" stroke="#e5e7eb"/>
  <text x="690" y="218" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">÷8</text>
  <text x="940" y="218" font-size="12" font-weight="bold" fill="#1f2937" text-anchor="end">320 MHz</text>
