  <text x="24" y="36" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">Divide-by-128 feedback divider — 7-stage ripple counter (cell divided_by_128counter)</text>
  <text x="24" y="58" font-size="12.5" font-weight="normal" fill="#5b6472" text-anchor="start">Each stage is a positive-edge D flip-flop in toggle mode (D tied to Q̅); each stage output clocks the next stage</text>
