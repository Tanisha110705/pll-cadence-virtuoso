  <rect x="40" y="300" width="1000" height="46" rx="8" fill="#fff7ed" stroke="#fdba74"/>
  <text x="56" y="320" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">fout = fin / 2^7 = fin / 128 (report: 50 % duty cycle at Q).  Ripple: stage k switches only after k accumulated clock-to-Q delays,</text>
  <text x="56" y="337" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">so the final edge lags the input edge. Each DFF = 6 NAND gates (NAND2/NAND3 cells). Net names as in the transient plot.</text>
